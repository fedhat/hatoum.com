<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
  <meta property="og:site_name" content="Federico Hatoum">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="{{og_type}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{og_image}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="alternate" type="application/rss+xml" title="Federico Hatoum — Blog" href="/blog/feed.xml">
  <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <script src="/assets/js/site.js" defer></script>
  {{head_extra}}
</head>
<body class="{{body_class}}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">
        <img src="/assets/icons/dog.png" alt="" width="30" height="30">
        <span>Federico Hatoum</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="nav-toggle-bars" aria-hidden="true"></span><span class="visually-hidden">Menu</span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Main">
        {{nav}}
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Toggle theme">
        <svg class="icon icon-moon" aria-hidden="true"><use href="/assets/icons/icons.svg#moon"></use></svg>
        <svg class="icon icon-sun" aria-hidden="true"><use href="/assets/icons/icons.svg#sun"></use></svg>
      </button>
    </div>
  </header>

  <main id="main">
{{content}}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div class="footer-about">
        <p class="footer-name">Federico Hatoum</p>
        <p>Software developer, maker &amp; YouTuber in Los Angeles.</p>
      </div>
      <nav aria-label="Elsewhere">
      <ul class="social">
        <li><a href="https://www.youtube.com/channel/UCQGkNFXJCUBLkzMIShzf12g" title="Fed Learns To Make on YouTube"><svg class="icon" aria-hidden="true"><use href="/assets/icons/icons.svg#youtube"></use></svg><span class="visually-hidden">Fed Learns To Make on YouTube</span></a></li>
        <li><a href="https://github.com/fedhat" title="GitHub"><svg class="icon" aria-hidden="true"><use href="/assets/icons/icons.svg#github"></use></svg><span class="visually-hidden">GitHub</span></a></li>
        <li><a href="https://www.linkedin.com/pub/federico-hatoum/0/866/1a2" title="LinkedIn"><svg class="icon" aria-hidden="true"><use href="/assets/icons/icons.svg#linkedin"></use></svg><span class="visually-hidden">LinkedIn</span></a></li>
        <li><a href="https://www.facebook.com/583536348" title="Facebook"><svg class="icon" aria-hidden="true"><use href="/assets/icons/icons.svg#facebook"></use></svg><span class="visually-hidden">Facebook</span></a></li>
        <li><a href="/blog/feed.xml" title="Blog RSS feed"><svg class="icon" aria-hidden="true"><use href="/assets/icons/icons.svg#rss"></use></svg><span class="visually-hidden">Blog RSS feed</span></a></li>
      </ul>
      </nav>
      <p class="footer-copy">© {{year}} Federico Hatoum</p>
    </div>
  </footer>
</body>
</html>
